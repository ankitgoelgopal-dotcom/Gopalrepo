name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run build

      - name: Create Android project and sync web build
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply permanent signing key and auto-increasing version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          p = "android/app/build.gradle"
          s = open(p).read()

          # Version code must go up on every build so Android accepts it as an update
          s, n1 = re.subn(r"versionCode\s+\d+", "versionCode " + os.environ["RUN_NUMBER"], s, count=1)
          s, n2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "1.0.' + os.environ["RUN_NUMBER"] + '"', s, count=1)

          # 1) point the existing release build type at the signing config
          s, n4 = re.subn(r"(buildTypes\s*\{\s*release\s*\{)", r"\1\n            signingConfig signingConfigs.release", s, count=1)

          # 2) define the signing config just before buildTypes
          signing = '''signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "gopal"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {'''
          s, n3 = re.subn(r"buildTypes\s*\{", signing, s, count=1)

          assert n1 and n2 and n3 and n4, (n1, n2, n3, n4)
          open(p, "w").write(s)
          PY

      - name: Build signed APK
        working-directory: android
        env:
          KS_PATH: ${{ github.workspace }}/keystore/gopal.keystore
          KS_PASS: gopal-app-2026
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk hello-gopal.apk

      - name: Upload APK to Actions tab (direct .apk, no zip)
        uses: actions/upload-artifact@v7
        with:
          path: hello-gopal.apk
          archive: false

      - name: Publish APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" hello-gopal.apk \
            --title "Hello Gopal APK #${{ github.run_number }}" \
            --notes "Signed APK built from commit ${{ github.sha }}."
