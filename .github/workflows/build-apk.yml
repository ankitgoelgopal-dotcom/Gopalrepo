name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            MSG=$(grep -E "^e: |What went wrong|Caused by|Could not|error:|FAILED|SDK|license" -A2 build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$MSG"
          fi
          exit $CODE

      - uses: actions/upload-artifact@v4
        with:
          name: NewLanguageKeyboard-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NewLanguageKeyboard.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" NewLanguageKeyboard.apk \
            --title "Keyboard APK build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}"
