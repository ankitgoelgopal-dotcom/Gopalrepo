name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NewLanguageKeyboard-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NewLanguageKeyboard.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" NewLanguageKeyboard.apk \
            --title "Keyboard APK build ${{ github.run_number }}" \
            --notes "Debug APK built from commit ${{ github.sha }}"
